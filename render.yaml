# 弈览 · 金铲铲 S18 攻略 — Render 部署（路径 A：海外，免备案）
# 用法：Render 新建 Web Service → 连 GitHub 仓库 → 选本文件即自动识别
services:
  - type: web
    name: yilan
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # 接广告联盟时填发布商 ID（如 ca-pub-xxxxxxxx），留空则不加载任何广告脚本
      - key: NEXT_PUBLIC_AD_CLIENT
        sync: false
      # 绑定域名后填 https://你的域名，用于 sitemap / robots（SEO）
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

# 点赞/评论存储层已「定型」为 SQLite（better-sqlite3），库文件默认落在 /app/data/social/social.db。
# 免费版 Render 不支持挂载卷，重启/重新部署会重置该数据；要持久，把 plan 升到 Starter（$7/月）
# 并取消下面注释挂载磁盘到 /app/data（与 DATA_DIR 默认一致）：
#    disks:
#      - name: yilan-data
#        mountPath: /app/data
#        sizeGB: 1
